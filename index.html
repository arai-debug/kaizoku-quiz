<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="かいぞくクイズ">
  <meta name="theme-color" content="#FFCB05">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>かいぞく クイズ</title>
</head>
<body>
  <!-- ハーフトーン+集中線の背景 -->
  <div class="bg-effects" aria-hidden="true">
    <div class="halftone"></div>
    <div class="speedlines"></div>
  </div>

  <!-- 1. タイトル画面 -->
  <section id="screen-title" class="screen active">
    <div class="title-stack">
      <div class="logo-burst">
        <svg class="burst-svg" viewBox="0 0 200 200" aria-hidden="true">
          <polygon points="100,0 115,70 200,55 140,110 195,170 110,135 100,200 90,135 5,170 60,110 0,55 85,70" fill="#FFCB05" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
        </svg>
        <div class="logo-text">
          <span class="logo-one">かいぞく</span>
        </div>
      </div>
      <div class="logo-quiz">クイズ<span class="bang">!!</span></div>

      <div class="jolly-mascot">
        <svg viewBox="0 0 160 200" width="150" height="180">
          <!-- きらきら -->
          <path d="M28 44 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill="#FFF" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
          <path d="M132 34 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#FFF" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
          <!-- ふた -->
          <path d="M22 108 A58 46 0 0 1 138 108 Z" fill="#D98E3C" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
          <!-- はこ -->
          <rect x="22" y="108" width="116" height="62" rx="6" fill="#C57C30" stroke="#1a1a1a" stroke-width="4"/>
          <!-- かなぐ(たて) -->
          <rect x="70" y="70" width="20" height="100" fill="#FFCB05" stroke="#1a1a1a" stroke-width="3"/>
          <!-- かなぐ(よこ) -->
          <rect x="22" y="100" width="116" height="14" fill="#FFCB05" stroke="#1a1a1a" stroke-width="3"/>
          <!-- かぎあな -->
          <rect x="66" y="116" width="28" height="26" rx="5" fill="#FFCB05" stroke="#1a1a1a" stroke-width="3"/>
          <circle cx="80" cy="126" r="5" fill="#1a1a1a"/>
          <rect x="77" y="126" width="6" height="10" fill="#1a1a1a"/>
          <!-- こばん -->
          <circle cx="16" cy="188" r="11" fill="#FFCB05" stroke="#1a1a1a" stroke-width="3"/>
          <circle cx="40" cy="194" r="8" fill="#FFCB05" stroke="#1a1a1a" stroke-width="3"/>
          <circle cx="144" cy="188" r="11" fill="#FFCB05" stroke="#1a1a1a" stroke-width="3"/>
          <circle cx="120" cy="194" r="8" fill="#FFCB05" stroke="#1a1a1a" stroke-width="3"/>
        </svg>
      </div>
    </div>

    <button class="btn btn-primary btn-large" data-action="go-menu">
      <span class="btn-text">はじめる</span>
      <span class="btn-arrow">▶</span>
    </button>
    <div class="title-tagline">たからばこを あけよう!!</div>
    <p class="disclaimer">ファンが つくった ひこうしきの クイズです。<br>しゅうえいしゃ・げんさくしゃとは かんけい ありません。</p>
  </section>

  <!-- 2. メニュー画面 -->
  <section id="screen-menu" class="screen">
    <header class="top-bar">
      <button class="btn-back" data-action="go-title" aria-label="もどる">◀</button>
      <div class="top-title">せってい</div>
      <div class="top-spacer"></div>
    </header>

    <div class="menu-section">
      <div class="section-label">むずかしさ</div>
      <div class="diff-grid">
        <button class="opt-card diff-card" data-mode="おためし">
          <div class="opt-emoji">🌱</div>
          <div class="opt-name">おためし</div>
          <div class="opt-sub">ぜんぶ</div>
        </button>
        <button class="opt-card diff-card selected" data-mode="つよい">
          <div class="opt-emoji">🔥</div>
          <div class="opt-name">つよい</div>
          <div class="opt-sub">ふつう+むずい</div>
        </button>
        <button class="opt-card diff-card" data-mode="たつじん">
          <div class="opt-emoji">👑</div>
          <div class="opt-name">たつじん</div>
          <div class="opt-sub">むずいだけ</div>
        </button>
      </div>
    </div>

    <div class="menu-section">
      <div class="section-label">ジャンル</div>
      <div class="genre-grid" id="genre-options"></div>
    </div>

    <div class="menu-section">
      <div class="section-label">もんだいかず</div>
      <div class="count-grid">
        <button class="opt-card count-card" data-count="5">5もん</button>
        <button class="opt-card count-card selected" data-count="10">10もん</button>
        <button class="opt-card count-card" data-count="20">20もん</button>
      </div>
    </div>

    <div class="best-banner">
      <span class="best-label">⭐ さいこうきろく</span>
      <span class="best-value"><span id="best-score">0</span> もん</span>
    </div>

    <button class="btn btn-primary btn-large" data-action="go-game">
      <span class="btn-text">あそぶ</span>
      <span class="btn-arrow">▶</span>
    </button>
  </section>

  <!-- 3. ゲーム画面 -->
  <section id="screen-game" class="screen">
    <header class="top-bar">
      <button class="btn-back" data-action="go-menu" aria-label="やめる">◀</button>
      <div class="hud-progress">Q<span id="progress-current">1</span> / <span id="progress-total">10</span></div>
      <div class="hud-score">⭐<span id="current-score">0</span></div>
    </header>

    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="question-card">
      <div class="question-meta">
        <span class="meta-diff" id="q-difficulty">ふつう</span>
        <span class="meta-genre" id="q-genre">エピソード</span>
      </div>
      <div class="question-text" id="question-text"></div>
      <div class="bubble-tail"></div>
    </div>

    <div class="choices" id="choices"></div>

    <div class="feedback" id="feedback" hidden>
      <div class="feedback-bang" id="feedback-bang">ドン!!</div>
      <div class="feedback-explanation" id="feedback-explanation"></div>
      <button class="btn btn-primary btn-next" id="btn-next">
        <span class="btn-text">つぎへ</span>
        <span class="btn-arrow">▶</span>
      </button>
    </div>
  </section>

  <!-- 4. 結果画面 -->
  <section id="screen-result" class="screen">
    <div class="result-card">
      <div class="result-banner" id="result-banner">FINISH!!</div>
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-rank" id="result-rank">海賊王級</div>
      <div class="result-score">
        <span id="result-score">0</span><span class="result-slash">/</span><span id="result-total">10</span>
      </div>
      <div class="result-stars" id="result-stars"></div>
      <div class="result-newbest" id="result-newbest" hidden>✨ さいこうきろくこうしん!! ✨</div>
      <div class="result-comment" id="result-comment"></div>
    </div>

    <div class="result-buttons">
      <button class="btn btn-primary" data-action="go-game">
        <span class="btn-text">もういっかい</span>
      </button>
      <button class="btn btn-secondary" data-action="go-menu">
        <span class="btn-text">メニュー</span>
      </button>
    </div>
  </section>

  <script src="storage.js"></script>
  <script src="audio.js"></script>
  <script src="quiz.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
